<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Is the Ballard Bridge up?</title>
    <meta name="description" content="A best guess at whether Seattle's Ballard Bridge is open for boats right now." />
    <link rel="canonical" href="https://seattle-bridges.com/ballard" />

    <!-- Link previews for links already shared as fremontbridge.com. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://seattle-bridges.com/ballard" />
    <meta property="og:title" content="Is the Ballard Bridge up right now?" />
    <meta property="og:description" content="A best guess from SDOT's opening log, live traffic and the bridge camera." />
    <meta property="og:image" content="https://seattle-bridges.com/img/og-ballard.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Ballard Bridge's green spans raised, seen from a boat on the canal" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Keep the path, so fremontbridge.com/ballard/ lands on seattle-bridges.com/ballard.
         The meta refresh is the fallback when scripts are off. -->
    <script>
      // The new site drops the trailing slash: /ballard/ goes to /ballard.
      location.replace("https://seattle-bridges.com" + location.pathname.replace(/(.)\/+$/, "$1") + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://seattle-bridges.com/ballard" />
  </head>
  <body>
    <p>The Ballard Bridge page moved to <a href="https://seattle-bridges.com/ballard">seattle-bridges.com/ballard</a>.</p>
  </body>
</html>
