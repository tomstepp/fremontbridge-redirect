<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Is the University Bridge up?</title>
    <meta name="description" content="A best guess at whether Seattle's University Bridge is open for boats right now." />
    <link rel="canonical" href="https://seattle-bridges.com/university/" />

    <!-- Link previews for links already shared as fremontbridge.com. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://seattle-bridges.com/university/" />
    <meta property="og:title" content="Is the University Bridge up right now?" />
    <meta property="og:description" content="A best guess from SDOT's opening log, live traffic and the bridge camera." />
    <meta property="og:image" content="https://seattle-bridges.com/img/og-university.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The University Bridge raised with the gate down and a car waiting" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Keep the path, so fremontbridge.com/ballard/ lands on seattle-bridges.com/ballard/.
         The meta refresh is the fallback when scripts are off. -->
    <script>
      location.replace("https://seattle-bridges.com" + location.pathname + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://seattle-bridges.com/university/" />
  </head>
  <body>
    <p>The University Bridge page moved to <a href="https://seattle-bridges.com/university/">seattle-bridges.com/university/</a>.</p>
  </body>
</html>
